<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero 預覽 — 機場貴賓室底圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family: 'Noto Sans TC','Inter',sans-serif; background:#0f172a; }

/* ═══════ HERO — 圖片版 ═══════ */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  text-align: center;
}

/* 底圖 */
.hero-bg {
  position: absolute;
  inset: 0;
  background-image: url('https://images.unsplash.com/photo-1540339832862-474599807836?w=1920&q=85');
  background-size: cover;
  background-position: center 35%;
  filter: brightness(0.72) saturate(1.1);
  transform: scale(1.03);
  transition: transform 8s ease;
}

/* 多層遮罩：底部漸暗 + 頂部輕遮 */
.hero-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg,
      rgba(5,15,35,.42) 0%,
      rgba(10,22,50,.28) 40%,
      rgba(5,12,30,.68) 80%,
      rgba(5,10,25,.88) 100%
    );
  z-index: 1;
}

/* 暖色暈染（呼應機場夕陽） */
.hero-warm {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 75% 40%,
    rgba(245,140,50,.12) 0%, transparent 65%);
  z-index: 2;
  pointer-events: none;
}

/* 細格紋 */
.hero-grid {
  position: absolute; inset: 0; z-index: 3;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 48px 48px;
}

.hero-inner {
  position: relative;
  z-index: 10;
  max-width: 680px;
  margin: 0 auto;
  padding: 80px 24px 90px;
}

/* chip */
.hero-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 999px;
  padding: 6px 18px;
  font-size: 12.5px;
  color: #bfdbfe;
  letter-spacing: .04em;
  font-weight: 500;
  margin-bottom: 28px;
  backdrop-filter: blur(12px);
}
.hero-chip::before { content:''; width:6px; height:6px; background:#38bdf8; border-radius:50%; }

/* plane */
.plane-wrap {
  font-size: 64px;
  display: block;
  margin-bottom: 20px;
  animation: soar 4s ease-in-out infinite;
  filter: drop-shadow(0 8px 24px rgba(14,165,233,.5));
}
@keyframes soar {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50%      { transform: translateY(-14px) rotate(3deg); }
}

/* headline */
.hero h1 {
  font-size: clamp(26px, 5.5vw, 44px);
  font-weight: 900;
  color: #fff;
  line-height: 1.25;
  letter-spacing: -.01em;
  margin-bottom: 14px;
  text-shadow: 0 4px 28px rgba(0,0,0,.5);
}
.hero h1 span { color: #7dd3fc; }

.hero p {
  font-size: 16px;
  color: rgba(255,255,255,.7);
  max-width: 440px;
  margin: 0 auto 36px;
  font-weight: 300;
  text-shadow: 0 2px 8px rgba(0,0,0,.4);
}

/* CTA */
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  color: white;
  padding: 13px 32px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 14.5px;
  text-decoration: none;
  box-shadow: 0 8px 32px rgba(14,165,233,.45);
  transition: transform .2s, box-shadow .2s;
  border: 1px solid rgba(255,255,255,.2);
}
.hero-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(14,165,233,.6); }

/* stats */
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 48px;
  padding-top: 36px;
  border-top: 1px solid rgba(255,255,255,.15);
}
.stat { text-align: center; }
.stat-num { font-size: 28px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
.stat-label { font-size: 11.5px; color: rgba(255,255,255,.5); margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }

/* ── 比較標籤 ── */
.compare-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10,20,45,.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,.12);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 999;
  font-family: 'Noto Sans TC', sans-serif;
}
.compare-label {
  color: #93c5fd;
  font-size: 13px;
  font-weight: 600;
}
.btn-orig {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s;
}
.btn-orig:hover { background: rgba(255,255,255,.2); }
.btn-new {
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  border: none;
  color: #fff;
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 4px 16px rgba(14,165,233,.4);
  transition: all .15s;
}
.btn-new:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(14,165,233,.55); }
</style>
</head>
<body>

<!-- ══ 機場貴賓室圖片版 HERO ══ -->
<header class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-warm"></div>
  <div class="hero-grid"></div>
  <div class="hero-inner">
    <div class="hero-chip">弈樂科技 員工專用</div>
    <span class="plane-wrap">✈️</span>
    <h1>115年國外旅遊補助<br><span>申請單使用教學</span></h1>
    <p>依照以下步驟，輕鬆完成申請，快速領取旅遊補助</p>
    <a href="https://chris-yl-tw.github.io/travel-form/" target="_blank" class="hero-cta">
      前往申請單 →
    </a>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num">4</div><div class="stat-label">填寫步驟</div></div>
      <div class="stat"><div class="stat-num">5</div><div class="stat-label">分鐘完成</div></div>
      <div class="stat"><div class="stat-num">自動</div><div class="stat-label">匯率換算</div></div>
    </div>
  </div>
</header>

<div class="compare-bar">
  <span class="compare-label">🖼 這是「圖片底圖」預覽版</span>
  <span style="color:rgba(255,255,255,.4);font-size:12px;">確認後回報是否要套用到正式版</span>
</div>

</body>
</html>
